receivers:
  otlp:
    protocols:
      grpc:
      http:
exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true
  debug:
    verbosity: detailed
  prometheus:
    endpoint: 0.0.0.0:8889
service:
  extensions: [zpages, pprof, headers_setter]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp, debug]
    metrics:
      receivers: [otlp]
      exporters: [prometheus, debug]

extensions:
  health_check:
  pprof:
  zpages:
    endpoint: 0.0.0.0:55679
  headers_setter:
    headers:
      - action: upsert
        key: X-Scope-OrgID
        value: my_tenant
      